<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026暑期赛事教练认证证书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .search-box {
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
        
        .search-hint {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .result-count {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 900px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
        
        .cert-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        
        .cert-card.roborave {
            border-top: 4px solid #4CAF50;
        }
        
        .cert-card.jbc {
            border-top: 4px solid #2196F3;
        }
        
        .cert-card.pook {
            border-top: 4px solid #9e9e9e;
            background: #fafafa;
        }
        
        .cert-header {
            padding: 15px;
            font-weight: 600;
            text-align: center;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        
        .cert-card.roborave .cert-header {
            color: #4CAF50;
        }
        
        .cert-card.jbc .cert-header {
            color: #2196F3;
        }
        
        .cert-card.pook .cert-header {
            color: #9e9e9e;
        }
        
        .cert-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .cert-image:hover {
            opacity: 0.9;
        }
        
        .cert-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9e9e9e;
            font-size: 3rem;
        }
        
        .cert-placeholder span {
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .cert-footer {
            padding: 15px;
            text-align: center;
        }
        
        .download-btn {
            display: inline-block;
            padding: 10px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        .pook-btn {
            background: #9e9e9e;
            cursor: not-allowed;
        }
        
        .pook-btn:hover {
            background: #9e9e9e;
            transform: none;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .modal-close:hover {
            transform: scale(1.2);
        }
        
        .modal-download {
            position: absolute;
            bottom: 30px;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .modal-download:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.85rem;
        }
        
        .no-result {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .no-result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏆 2026暑期赛事教练认证</h1>
        <p class="subtitle">RoboRAVE & JBC & POOK</p>
    </header>
    
    <div class="container">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 输入姓名搜索证书..." autofocus>
        </div>
        
        <p class="search-hint">支持模糊搜索，例如输入"刘"可查找所有姓刘的老师</p>
        
        <div id="resultCount" class="result-count"></div>
        <div id="cardsContainer" class="cards-container"></div>
    </div>
    
    <footer>
        <p>如有疑问，请联系赛事组委会</p>
    </footer>
    
    <!-- 模态框 -->
    <div class="modal" id="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="">
        <a class="modal-download" id="modalDownload" href="" download>⬇ 下载原图</a>
    </div>
    
    <script src="data.js"></script>
    <script>
        const searchInput = document.getElementById('searchInput');
        const cardsContainer = document.getElementById('cardsContainer');
        const resultCount = document.getElementById('resultCount');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalDownload = document.getElementById('modalDownload');
        
        let currentResults = [];
        
        // 搜索功能
        function search(query) {
            query = query.trim().toLowerCase();
            if (!query) {
                cardsContainer.innerHTML = '';
                resultCount.textContent = '';
                return;
            }
            
            currentResults = certData.filter(item => 
                item.name.toLowerCase().includes(query)
            );
            
            renderResults(currentResults);
        }
        
        // 渲染结果
        function renderResults(results) {
            resultCount.textContent = `找到 ${results.length} 位老师的证书`;
            
            if (results.length === 0) {
                cardsContainer.innerHTML = `
                    <div class="no-result" style="grid-column: 1/-1;">
                        <div class="no-result-icon">🔍</div>
                        <p>未找到匹配的证书</p>
                        <p style="margin-top: 10px; font-size: 0.9rem;">请检查姓名是否正确</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            results.forEach(item => {
                html += `
                    <div class="cert-card roborave">
                        <div class="cert-header">🏆 RoboRAVE 认证教练证书</div>
                        ${item.roborave ? 
                            `<img class="cert-image" src="${item.roborave}" alt="RoboRAVE证书" onclick="openModal('${item.roborave}')">` :
                            '<div class="cert-placeholder">📄</div>'
                        }
                        <div class="cert-footer">
                            ${item.roborave ? 
                                `<a class="download-btn" href="${item.roborave}" download="${item.name}_RoboRAVE证书.jpg">⬇ 下载</a>` :
                                '<span style="color: #999;">暂无可用</span>'
                            }
                        </div>
                    </div>
                    
                    <div class="cert-card jbc">
                        <div class="cert-header">🎓 JBC 认证教练证书</div>
                        ${item.jbc ? 
                            `<img class="cert-image" src="${item.jbc}" alt="JBC证书" onclick="openModal('${item.jbc}')">` :
                            '<div class="cert-placeholder">📄</div>'
                        }
                        <div class="cert-footer">
                            ${item.jbc ? 
                                `<a class="download-btn" href="${item.jbc}" download="${item.name}_JBC证书.jpg">⬇ 下载</a>` :
                                '<span style="color: #999;">暂无可用</span>'
                            }
                        </div>
                    </div>
                    
                    <div class="cert-card pook">
                        <div class="cert-header">🎯 POOK 认证</div>
                        <div class="cert-placeholder">
                            🔒
                            <span>即将上线</span>
                        </div>
                        <div class="cert-footer">
                            <a class="download-btn pook-btn" href="javascript:void(0)">敬请期待</a>
                        </div>
                    </div>
                `;
            });
            
            cardsContainer.innerHTML = html;
        }
        
        // 打开模态框
        function openModal(src) {
            modalImage.src = src;
            modalDownload.href = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭模态框
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // 点击模态框背景关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
        
        // ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // 输入事件
        let debounceTimer;
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                search(this.value);
            }, 150);
        });
        
        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            searchInput.focus();
        });
    </script>
</body>
</html>
