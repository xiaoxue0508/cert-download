const input=document.getElementById('searchInput');
const results=document.getElementById('results');
const info=document.getElementById('info');
const toast=document.getElementById('toast');

function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function render(list, q){
  if(!list.length){results.innerHTML='';return}
  const re=q?new RegExp('('+esc(q)+')','gi'):'';
  results.innerHTML=list.slice(0,200).map(s=>{
    const h=re?s.replace(re,'<span class="highlight">$1</span>'):s;
    return '<div class="result-item" data-name="'+s.replace(/"/g,'&quot;')+'">'+h+'</div>';
  }).join('');

}

let timer;
input.addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const q=input.value.trim();
    if(!q){info.textContent='';render([]);return}
    const f=S.filter(s=>s.includes(q));
    info.textContent='';
    render(f,q);
  },150);
});

results.addEventListener('click',e=>{
  const item=e.target.closest('.result-item');
  if(!item)return;
  const name=item.dataset.name;
  navigator.clipboard.writeText(name).then(()=>showToast()).catch(()=>{
    const ta=document.createElement('textarea');ta.value=name;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast();
  });
});

function showToast(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
